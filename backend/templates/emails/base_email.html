<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MotoRide{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border-radius:8px;overflow:hidden;
                    box-shadow:0 2px 8px rgba(0,0,0,.08);">

        <!-- Header -->
        <tr>
          <td style="background:#111827;padding:24px 32px;">
            <span style="font-size:24px;font-weight:700;color:#f97316;letter-spacing:-0.5px;">Moto</span>
            <span style="font-size:24px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;">Ride</span>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:32px;">
            {% block body %}{% endblock %}
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background:#f9fafb;padding:20px 32px;border-top:1px solid #e5e7eb;
                     font-size:12px;color:#9ca3af;text-align:center;">
            {% block footer %}
              &copy; 2026 MotoRide. All rights reserved.<br />
              You are receiving this email because you placed an order with us.
            {% endblock %}
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
